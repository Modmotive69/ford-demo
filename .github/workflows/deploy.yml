name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      # Deploy committed pages as-is: do not rewrite nav/footer during release.
      - name: Build public-only release
        run: python3 build-public.py

      - name: Compile Pages Worker with private dependencies
        run: wrangler pages functions build functions --outdir release-public/_worker.js --compatibility-date=2026-09-21

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e9f08860a16c8042a1ec49677ee7c181
        run: wrangler pages deploy release-public --project-name=ford-demo --branch=main --commit-hash="$GITHUB_SHA"
